name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: medialane_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "7.4"
          tools: phpunit:9
      - run: sudo apt-get update && sudo apt-get install -y subversion
      - run: composer global require --dev yoast/phpunit-polyfills:"^2.0"
      - run: echo "WP_TESTS_PHPUNIT_POLYFILLS_PATH=$(composer global config vendor-dir --absolute)/yoast/phpunit-polyfills" >> "$GITHUB_ENV"
      - run: bash bin/install-wp-tests.sh medialane_test root root 127.0.0.1 latest
      - env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: phpunit -c phpunit.xml.dist
